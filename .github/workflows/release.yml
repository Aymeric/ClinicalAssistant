name: Release (Google Play & Apple App Store)

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Release Track'
        required: true
        type: choice
        default: 'internal'
        options:
          - 'internal'
          - 'alpha'
          - 'beta'
          - 'production'
          - 'none'
      deploy_apple:
        description: 'Deploy to Apple TestFlight / App Store'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Release notes / What to test'
        required: false
        type: string
        default: ''
      draft_release:
        description: 'Create draft GitHub Release with binaries'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Verify Code & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

  build_and_deploy_android:
    name: Build & Release Android (Google Play)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android Keystore & Signing Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            if [ -n "$KEY_PROPERTIES" ]; then
              echo "$KEY_PROPERTIES" > android/key.properties
            else
              cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            fi
            echo "Android signing configured."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not found; building with fallback signing."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Android Release AppBundle (.aab)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare Google Play Release Notes
        env:
          USER_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          if [ -n "$USER_RELEASE_NOTES" ]; then
            echo "$USER_RELEASE_NOTES" > distribution/whatsnew/whatsnew-en-US
          fi
          echo "Release notes:"
          cat distribution/whatsnew/whatsnew-en-US

      - name: Publish to Google Play Store
        if: env.PLAY_STORE_JSON != '' && env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1.1.5
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_UPLOAD_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ github.event.inputs.play_track || 'internal' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_UPLOAD_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME || 'com.example.clinical_assistant' }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: 'completed'
          whatsNewDirectory: distribution/whatsnew

  build_and_deploy_ios:
    name: Build & Release iOS (Apple App Store / TestFlight)
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Configure iOS Signing Keychain & Profiles
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.example.clinicalAssistant' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            # Decode certificate
            echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

            # Provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

            # Create keychain
            KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain
            security create-keychain -p "" build.keychain
            security list-keychains -s build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security set-keychain-settings -t 3600 -l $KEYCHAIN_PATH

            # Import certificate into keychain
            security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

            # Extract Profile UUID
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision))
            cp ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
            echo "Installed Provisioning Profile UUID: $PROFILE_UUID"

            # Create ExportOptions.plist if not supplied directly
            if [ -n "$EXPORT_OPTIONS_PLIST" ]; then
              echo "$EXPORT_OPTIONS_PLIST" > ios/ExportOptions.plist
            else
              cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
            fi

            # Configure Xcode project for manual release signing
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' ios/Runner.xcodeproj/project.pbxproj
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; PROVISIONING_PROFILE = $PROFILE_UUID;/g" ios/Runner.xcodeproj/project.pbxproj
            echo "iOS signing and ExportOptions configured."
          else
            echo "iOS signing credentials not fully provided; creating default ExportOptions for unmanaged export."
            cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-number=${{ github.run_number }}

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Prepare TestFlight What-To-Test Notes
        env:
          USER_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          mkdir -p ios/TestFlight
          if [ -n "$USER_RELEASE_NOTES" ]; then
            echo "$USER_RELEASE_NOTES" > ios/TestFlight/WhatToTest.en-US.txt
          elif [ -f "distribution/whatsnew/whatsnew-en-US" ]; then
            cp distribution/whatsnew/whatsnew-en-US ios/TestFlight/WhatToTest.en-US.txt
          else
            echo "Quality and stability improvements." > ios/TestFlight/WhatToTest.en-US.txt
          fi
          echo "TestFlight notes:"
          cat ios/TestFlight/WhatToTest.en-US.txt

      - name: Check Apple Deployment Credentials
        id: apple_creds
        run: |
          echo "has_api_key=${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_password=${{ secrets.APP_STORE_CONNECT_USERNAME != '' && secrets.APP_STORE_CONNECT_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload to Apple TestFlight / App Store (API Key)
        if: ${{ (github.event.inputs.deploy_apple != 'false') && (steps.apple_creds.outputs.has_api_key == 'true') }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Upload to Apple TestFlight (App-Specific Password Fallback)
        if: ${{ (github.event.inputs.deploy_apple != 'false') && (steps.apple_creds.outputs.has_api_key != 'true') && (steps.apple_creds.outputs.has_password == 'true') }}
        run: |
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios -f "$IPA_FILE" \
            --username "${{ secrets.APP_STORE_CONNECT_USERNAME }}" \
            --password "${{ secrets.APP_STORE_CONNECT_PASSWORD }}"

  create_github_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_and_deploy_android, build_and_deploy_ios]
    if: ${{ always() && (github.event.inputs.draft_release != 'false' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p dist
          find release-artifacts -name "*.apk" -exec cp {} dist/ \;
          find release-artifacts -name "*.aab" -exec cp {} dist/ \;
          find release-artifacts -name "*.ipa" -exec cp {} dist/ \;
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: ${{ github.event.inputs.draft_release == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.ipa
